# Keeps the free Supabase project from pausing after a week of no activity.
# Add two repository secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_URL        e.g. https://xxxx.supabase.co
#   SUPABASE_ANON_KEY   the public anon key
name: Supabase keep-alive

on:
  schedule:
    - cron: '0 6 */3 * *' # every 3 days, 06:00 UTC
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query the content table
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -e
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then echo "Missing SUPABASE_URL / SUPABASE_ANON_KEY secrets"; exit 1; fi
          code=$(curl -s -o /tmp/out.json -w "%{http_code}" "${SUPABASE_URL%/}/rest/v1/content?select=key&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" -H "Authorization: Bearer $SUPABASE_ANON_KEY")
          echo "HTTP $code"; cat /tmp/out.json; echo
          [ "$code" = "200" ]
